name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: '3.24.0'
  PYTHON_VERSION: '3.12'

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Annex-Fbu/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: Annex-Fbu/backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint + format)
        run: ruff check app tests

      - name: Run Ruff format check
        run: ruff format --check app tests

      - name: Run import-linter (architecture)
        run: import-linter

      - name: Run MyPy (type checking)
        run: mypy app

      - name: Run Tests with Coverage
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=xml --cov-fail-under=85

      - name: Validate observability imports
        run: |
          python -c "
          from app.core.observability import (
              configure_logging, get_logger,
              init_tracing, get_tracer,
              init_metrics, get_meter, metrics_middleware,
              init_sentry
          )
          print('Observability imports OK')
          "

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  dart-packages:
    name: Dart Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Annex-Fbu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies (shared_models)
        run: cd packages/shared_models && flutter pub get

      - name: Get dependencies (shared_ui)
        run: cd packages/shared_ui && flutter pub get

      - name: Get dependencies (shared_utils)
        run: cd packages/shared_utils && flutter pub get

      - name: Get dependencies (shared_features)
        run: cd packages/shared_features && flutter pub get

      - name: Analyze shared_models
        run: cd packages/shared_models && flutter analyze

      - name: Analyze shared_ui
        run: cd packages/shared_ui && flutter analyze

      - name: Analyze shared_utils
        run: cd packages/shared_utils && flutter analyze

      - name: Analyze shared_features
        run: cd packages/shared_features && flutter analyze

      - name: Run dart_code_metrics (shared_models)
        run: cd packages/shared_models && dart run dart_code_metrics:metrics analyze lib

      - name: Run dart_code_metrics (shared_ui)
        run: cd packages/shared_ui && dart run dart_code_metrics:metrics analyze lib

      - name: Run dart_code_metrics (shared_utils)
        run: cd packages/shared_utils && dart run dart_code_metrics:metrics analyze lib

      - name: Run dart_code_metrics (shared_features)
        run: cd packages/shared_features && dart run dart_code_metrics:metrics analyze lib

      - name: Test shared_models
        run: cd packages/shared_models && flutter test

      - name: Test shared_ui
        run: cd packages/shared_ui && flutter test

      - name: Test shared_utils
        run: cd packages/shared_utils && flutter test

      - name: Test shared_features
        run: cd packages/shared_features && flutter test

      - name: Validate observability exports
        run: |
          cd packages/shared_features
          dart run --enable-asserts -c "import 'src/observability/observability.dart'; void main() { print('Observability exports OK'); }"

  web-app:
    name: Web App (Flutter Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Annex-Fbu/apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run dart_code_metrics
        run: dart run dart_code_metrics:metrics analyze lib

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /

  mobile-app:
    name: Mobile App (Flutter)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Annex-Fbu/apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run dart_code_metrics
        run: dart run dart_code_metrics:metrics analyze lib

      - name: Test
        run: flutter test

      - name: Build iOS (verify)
        run: flutter build ios --release --no-codesign
        env:
          FLUTTER_BUILD_IOS_NO_SIGN: 1

      - name: Build Android (verify)
        run: flutter build apk --release

  extension:
    name: Browser Extension (TypeScript/React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Annex-Fbu/apps/extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Annex-Fbu/apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, web-app]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: Annex-Fbu/backend
          push: false
          tags: annex-backend:test
          load: true

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: Annex-Fbu/apps/web
          push: false
          tags: annex-web:test
          load: true

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run pip-audit (backend)
        run: |
          cd Annex-Fbu/backend
          pip install pip-audit
          pip-audit --desc --format=json --output=pip-audit.json || true
        continue-on-error: true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: Annex-Fbu/backend/pip-audit.json
          retention-days: 7

  contract-test:
    name: Contract Testing
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for breaking change detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend deps
        run: |
          cd Annex-Fbu/backend
          pip install -e ".[dev]"

      - name: Generate OpenAPI spec
        run: |
          cd Annex-Fbu/backend
          python scripts/generate_openapi.py
        env:
          PYTHONPATH: .

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: Annex-Fbu/backend/openapi/openapi.json
          retention-days: 7

      - name: Download previous spec for breaking change check
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: Annex-Fbu/backend/openapi/previous
        continue-on-error: true

      - name: Run breaking change detection
        run: |
          cd Annex-Fbu/backend
          python scripts/generate_openapi.py
        env:
          PYTHONPATH: .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install openapi-generator-cli
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Generate Dart models from OpenAPI
        run: |
          cd Annex-Fbu/packages/shared_models
          python ../../../backend/scripts/generate_openapi.py 2>/dev/null || true
          # Use the uploaded spec
          cp ../../../backend/openapi/openapi.json ./openapi.json
        continue-on-error: true

      - name: Validate Dart models generation
        run: |
          cd Annex-Fbu/packages/shared_models
          if [ -f openapi.json ]; then
            npx @openapitools/openapi-generator-cli generate \
              -i openapi.json \
              -g dart-dio \
              -o generated \
              --additional-properties \
              "pubName=shared_models,pubVersion=0.1.0,useDio=true,serializationLibrary=json_serializable,generateSourceCodeOnly=true"
            dart analyze generated/lib
          else
            echo "OpenAPI spec not available, skipping Dart generation"
          fi
        continue-on-error: true

      - name: Generate TypeScript types from OpenAPI
        run: |
          cd Annex-Fbu/apps/extension
          if [ -f ../../backend/openapi/openapi.json ]; then
            cp ../../backend/openapi/openapi.json ./openapi.json
          fi
        continue-on-error: true

      - name: Validate TypeScript types generation
        run: |
          cd Annex-Fbu/apps/extension
          if [ -f openapi.json ]; then
            npx @openapitools/openapi-generator-cli generate \
              -i openapi.json \
              -g typescript-axios \
              -o generated-types \
              --additional-properties \
              "npmName=@annex/api-client,npmVersion=0.1.0,supportsES6=true,withInterfaces=true"
            npx tsc --noEmit -p generated-types/tsconfig.json 2>/dev/null || echo "TypeScript validation skipped (no tsconfig)"
          else
            echo "OpenAPI spec not available, skipping TypeScript generation"
          fi
        continue-on-error: true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend, dart-packages, web-app, mobile-app, extension, docker, security, contract-test]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "CI failed - check GitHub Actions for details"
          # Add Slack/Discord/email notification here if needed