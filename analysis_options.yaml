    - prefer_correct_stream_length
    - prefer_moving_to_variable
    - prefer_single_widget_per_file
    - avoid_unnecessary_conditionals
    - avoid_unnecessary_type_assertions
    - avoid_unnecessary_type_conversions
    - avoid_returning_widgets
    - avoid_returning_this
    - prefer_match_file_name
    - avoid_types_on_closure_parameters
    - avoid_ignoring_return_values
    - avoid_long_parameter_list
    - avoid_long_methods
    - avoid_long_functions
    - avoid_deep_nesting
    - prefer_early_return
    - avoid_redundant_argument_values
    - prefer_expression_function_bodies
    - prefer_final_parameters
    - avoid_dynamic
    - prefer_relative_imports
    - avoid_unused_parameters
    - prefer_const_directives
    - avoid_unnecessary_getter
    - prefer_function_declarations_over_variables

  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 5
    maximum-nesting-level: 4
    lines-of-code: 50
    number-of-methods: 15

  rules:
    # Enforce clean architecture boundaries
    - avoid-dynamic:
        severity: error
    - avoid-unused-parameters:
        severity: error
    - prefer-relative-imports:
        severity: error
    - avoid-long-parameter-list:
        severity: warning
    - avoid-long-methods:
        severity: warning
    - avoid-deep-nesting:
        severity: warning
    - prefer-early-return:
        severity: warning