# Shared analysis options for all Dart packages in the ANNEX monorepo.
# This file is referenced by each package's analysis_options.yaml via `include`.

include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - dart_code_metrics

  # Treat these as errors (not warnings) to enforce clean architecture
  errors:
    # Architecture: prevent UI from importing domain/business logic directly
    avoid_dynamic_calls: error
    avoid_redundant_argument_values: error
    avoid_unused_constructor_parameters: error
    avoid_void_async: error
    unnecessary_late: error
    unnecessary_nullable_for_final_variable_declarations: error

  # Exclude generated files
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

linter:
  rules:
    # --- Core Dart hygiene ---
    - always_declare_return_types
    - always_put_required_named_parameters_first
    - annotate_overrides
    - avoid_bool_literals_in_conditional_expressions
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - avoid_classes_with_only_static_members
    - avoid_double_and_int_checks
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_escaping_inner_quotes
    - avoid_field_initializers_in_const_classes
    - avoid_function_literals_in_foreach_calls
    - avoid_init_to_null
    - avoid_js_rounded_ints
    - avoid_multiple_declarations_per_line
    - avoid_null_checks_in_equality_operators
    - avoid_positional_boolean_parameters
    - avoid_print
    - avoid_redundant_argument_values
