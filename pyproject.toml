[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annex-api"
version = "0.1.0"
description = "ANNEX - 'Learn Before You Believe' AI-powered media and information literacy platform (backend)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ANNEX" }]
keywords = ["media-literacy", "ai", "fastapi", "supabase", "openai"]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "supabase>=2.5,<3.0",
    "openai>=1.40,<2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "tests", "supabase"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI idiom - callables in argument defaults (Depends/File/BackgroundTasks).
"app/interface/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"