services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    image: annex-api:dev
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    command: celery -A app.infrastructure.jobs.celery_app.celery_app worker --loglevel=info

  api:
    build: .
    image: annex-api:dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    # Mount for hot-reload during development (requires .env to be present).
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload