name: shared_ui
description: >-
  ANNEX design system — tokens, light/dark themes, and core components
  (buttons, score meters, claim cards) shared by the Flutter apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics: ^6.0.0

flutter:
  uses-material-design: true
