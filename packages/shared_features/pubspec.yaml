name: shared_features
description: >-
  ANNEX shared Flutter features — controllers, ports, screens, and the DI
  composition root reused by the mobile and web apps (Phase 12). Each app
  keeps only its platform-specific shell, theming, and entry-point code.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Shared monorepo packages (ADR-0002 / ADR-0007).
  shared_utils:
    path: ../shared_utils
  shared_models:
    path: ../shared_models
  shared_ui:
    path: ../shared_ui

  # Networking + state.
  http: ^1.5.0
  provider: ^6.1.0

  # Authentication (ADR-0005): Firebase Auth SDK — anonymous, email, Google.
  firebase_auth: ^6.0.0
  google_sign_in: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics: ^6.0.0

flutter:
  uses-material-design: true
