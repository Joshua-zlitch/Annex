name: shared_models
description: >-
  Canonical ANNEX domain models — analysis, i18n, and user shapes shared by
  the Flutter clients, serialized compatibly with the backend OpenAPI
  contract (ADR-0002).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics: ^6.0.0

# Contract testing: generate Dart models from OpenAPI spec
# Run with: dart run openapi_generator:generate
dependency_overrides:
  openapi_generator: ^6.0.0
