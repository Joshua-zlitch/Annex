# =====================================================================
# ANNEX backend — project metadata and tooling configuration.
# Dependencies are pinned to the latest stable releases (verified
# 2026-08-11) for reproducible builds; lockfile (uv.lock / requirements)
# follows in Phase 3 hardening.
# =====================================================================

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annex-backend"
version = "0.1.0"
description = "ANNEX backend — AI-powered Media & Information Literacy platform API (FastAPI service layer)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ANNEX Contributors" }]
keywords = ["media-literacy", "fact-checking", "fastapi", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.4",
    "firebase-admin==7.5.0",
    "openai==2.53.0",
    "google-genai==2.17.0",
    "pytesseract==0.3.13",
    "opencv-python-headless==5.0.0.93",
    "celery==5.6.3",
    "redis==6.4.0",
    # Observability
    "sentry-sdk[fastapi,celery,redis,sqlalchemy]==2.21.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.49b0",
    "opentelemetry-instrumentation-psycopg==0.49b0",
    "opentelemetry-instrumentation-redis==0.49b0",
    "opentelemetry-instrumentation-celery==0.49b0",
    "opentelemetry-instrumentation-httpx==0.49b0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-exporter-prometheus==0.49b0",
    "prometheus-client==0.21.1",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "mypy==2.3.0",
    "import-linter==2.20.0",
    # Observability testing
    "pytest-mock==3.14.0",
    "freezegun==1.5.1",
    # Contract testing
    "openapi-spec-validator==0.7.3",
    "jsonschema==4.23.0",
]

[project.scripts]
annex-api = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's Depends() in default arguments is the framework idiom, not a bug.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

# ---------------------------------------------------------------------
# Mypy (static type checking)
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "."

# Firebase Admin SDK ships without type stubs.
[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*", "google.auth.*"]
ignore_missing_imports = true

# pytesseract ships without type stubs.
[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true

# Celery ships without type stubs.
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
