name: annex_web
description: >-
  ANNEX web app — the Flutter Web + PWA entry point of the same product
  codebase as the mobile app. Hosted on Firebase Hosting (Phase 12).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Shared monorepo packages (ADR-0002 / ADR-0007 / Phase 12): the web
  # app contributes only its shell and entry point; features come from
  # shared_features.
  shared_utils:
    path: ../../packages/shared_utils
  shared_models:
    path: ../../packages/shared_models
  shared_ui:
    path: ../../packages/shared_ui
  shared_features:
    path: ../../packages/shared_features

  # State + platform init.
  provider: ^6.1.0
  firebase_core: ^4.0.0
  # Observability
  sentry_flutter: ^8.0.0
  # Material adaptive icons reference the Cupertino icon font (keeps the
  # web build warning-free when icon tree-shaking is on).
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics: ^6.0.0

flutter:
  uses-material-design: true
